<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Alchemy Lab v0.2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, rgba(96,102,190,.25), transparent 30%), linear-gradient(180deg,#0f1228 0%, #14193a 100%);
      color: #fff;
    }
    body { padding: 16px; }
    .app { max-width: 1120px; margin: 0 auto; }
    .hud, .panel { background: rgba(32,37,77,.92); border: 1px solid rgba(255,255,255,.08); border-radius: 22px; box-shadow: 0 18px 36px rgba(0,0,0,.24); }
    .hud { position: sticky; top: 0; padding: 12px 14px; margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; z-index: 10; }
    .chip { background: rgba(255,255,255,.08); border-radius: 999px; padding: 8px 12px; font-weight: 800; }
    .panel { padding: 20px; }
    .hero { display: grid; gap: 18px; margin-bottom: 16px; }
    .eyebrow { color: #f5c76c; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
    h1 { font-size: 34px; }
    .subtitle { max-width: 720px; line-height: 1.5; opacity: .86; }
    .objective-layout { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
    .objective-card, .recipes-card, .order-card { background: rgba(255,255,255,.06); border-radius: 18px; padding: 16px; }
    .objective-eyebrow, .recipes-header { display: inline-block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #f5c76c; margin-bottom: 10px; }
    .objective-card h3 { font-size: 22px; margin-bottom: 8px; }
    .objective-card p { line-height: 1.5; margin-bottom: 10px; }
    .objective-card ul { display: grid; gap: 8px; padding-left: 18px; }
    .recipe-rail, .stack, .journal { display: grid; gap: 10px; }
    .recipe-chip { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; border-radius:14px; background: rgba(255,255,255,.05); }
    .recipe-part { font-size: 13px; font-weight: 700; }
    .recipe-part.target { color: #f5c76c; }
    .recipe-arrow { opacity: .65; font-size: 13px; }
    .actions, .compact-actions, .board-status { display: flex; gap: 12px; flex-wrap: wrap; }
    button { border: 0; border-radius: 14px; min-height: 48px; padding: 12px 18px; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform .1s ease, opacity .1s ease, box-shadow .12s ease; }
    .gold { color: #1f1600; background: linear-gradient(180deg,#f5c76c 0%, #e5a94b 100%); }
    .secondary { color: #fff; background: rgba(255,255,255,.12); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.focus { box-shadow: 0 0 0 3px rgba(245,199,108,.32), 0 0 24px rgba(245,199,108,.24); }
    .layout { display: grid; grid-template-columns: 1.1fr 1.3fr 1fr; gap: 16px; }
    .panel-header { display:flex; justify-content:space-between; gap:12px; align-items:baseline; margin-bottom: 14px; }
    .muted { opacity: .72; }
    .summary-chip { padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.07); font-size: 13px; font-weight: 700; }
    .order-main { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .order-item { display:flex; gap:12px; align-items:center; }
    .order-emoji { font-size:28px; }
    .order-reward { font-weight: 800; color: #f5c76c; }
    .order-progress { padding:10px 12px; border-radius: 12px; background: rgba(255,255,255,.05); font-weight:700; }
    .order-progress.ready { background: rgba(141,229,125,.16); box-shadow: inset 0 0 0 1px rgba(141,229,125,.24); }
    .formula-line { color:#f5c76c; font-weight:700; }
    .board { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px; }
    .cell { min-height:118px; border-radius:16px; display:grid; gap:8px; place-content:center; background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.14)); border:2px solid transparent; color:#fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
    .cell.locked { opacity:.35; }
    .cell.empty { color: rgba(255,255,255,.4); }
    .cell.selected { border-color:#f5c76c; box-shadow: 0 0 0 2px rgba(245,199,108,.25); }
    .cell.goal, .cell.match { box-shadow: 0 0 0 2px rgba(245,199,108,.22), 0 0 18px rgba(245,199,108,.16); }
    .cell.flash { animation: mergeFlash .48s ease-out; }
    .entry { background: rgba(255,255,255,.06); border-radius:14px; padding:12px; display:flex; gap:12px; align-items:center; }
    .entry.hidden { opacity:.45; }
    .journal-name { font-weight:800; margin-bottom:4px; }
    .toast-wrap { position: sticky; top: 74px; z-index: 15; display:flex; justify-content:center; min-height: 0; pointer-events:none; }
    .toast { padding: 10px 16px; border-radius: 999px; font-weight: 800; box-shadow: 0 16px 28px rgba(0,0,0,.28); }
    .toast.info { background: rgba(127,213,255,.18); border: 1px solid rgba(127,213,255,.45); }
    .toast.success { background: rgba(141,229,125,.16); border: 1px solid rgba(141,229,125,.42); }
    .toast.magic { background: rgba(216,168,255,.16); border: 1px solid rgba(216,168,255,.42); }
    @keyframes mergeFlash { 0% { transform: scale(.94); box-shadow: 0 0 0 0 rgba(245,199,108,.45); } 60% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(245,199,108,0); } 100% { transform: scale(1); } }
    @media (max-width: 980px) { .objective-layout, .layout { grid-template-columns: 1fr; } }
    @media (max-width: 640px) { h1 { font-size: 28px; } .order-main { flex-direction: column; align-items: flex-start; } .cell { min-height: 96px; } }
  </style>
</head>
<body>
  <div class="app">
    <div id="toastWrap" class="toast-wrap"></div>

    <div class="hud">
      <div class="chip">✨ Эссенция: <span id="essence">0</span></div>
      <div class="chip">📘 Открытия: <span id="discoveriesCount">1</span></div>
      <div class="chip">📜 Заказы: <span id="ordersCompleted">0</span></div>
    </div>

    <section class="panel hero">
      <div>
        <div class="eyebrow">Product Pilot v0.2</div>
        <h1>Alchemy Lab</h1>
        <p class="subtitle">Понятный merge-прототип: создай Spark, соедини одинаковые элементы, выполни первый заказ и потрать первую essence на развитие лаборатории.</p>
      </div>

      <div class="objective-layout">
        <div id="objectiveCard" class="objective-card"></div>
        <div class="recipes-card">
          <div class="recipes-header">Быстрые рецепты</div>
          <div id="recipeRail" class="recipe-rail"></div>
        </div>
      </div>

      <div class="actions">
        <button id="gatherBtn" class="gold">Создать Spark</button>
        <button id="fulfillBtn" class="secondary">Сдать заказ</button>
      </div>
    </section>

    <section class="layout">
      <div class="panel stack">
        <h2>Текущий заказ</h2>
        <div id="orderCard" class="order-card"></div>
        <div class="compact-actions">
          <button id="unlockBtn" class="secondary">Открыть клетку</button>
          <button id="catalystBtn" class="secondary">Усилить катализатор</button>
        </div>
      </div>

      <div class="panel stack">
        <div class="panel-header">
          <h2>Алхимический стол</h2>
          <span id="boardHint" class="muted"></span>
        </div>
        <div id="boardStatus" class="board-status"></div>
        <div id="board" class="board"></div>
      </div>

      <div class="panel stack">
        <h2>Журнал открытий</h2>
        <div id="journal" class="journal"></div>
      </div>
    </section>
  </div>

  <script>
    const KEY = 'alchemy_lab_standalone_save_v2';
    const ITEMS = [
      { tier: 0, name: 'Spark', emoji: '✨', color: '#f7d774', description: 'Базовая искра для старта любого рецепта.' },
      { tier: 1, name: 'Glow Herb', emoji: '🌿', color: '#8de57d', description: 'Первый живой ингредиент лаборатории.' },
      { tier: 2, name: 'Moon Bloom', emoji: '🌸', color: '#d8a8ff', description: 'Магический цветок для редких заказов.' },
      { tier: 3, name: 'Aether Crystal', emoji: '💎', color: '#7fd5ff', description: 'Кристалл чистой алхимической энергии.' },
      { tier: 4, name: 'Sun Elixir', emoji: '🧪', color: '#ffbe6b', description: 'Главное зелье MVP-цепочки.' }
    ];
    const ORDER_REWARDS = { 1: 12, 2: 28, 3: 65, 4: 150 };
    const unlockCosts = [12, 28, 55];
    const gridSize = 9;
    let selectedIndex = null;
    let flashCellIndex = null;
    let toastTimer = null;
    let toastState = null;

    function createInitialState() {
      const grid = Array.from({ length: gridSize }, () => null);
      grid[0] = 0;
      return {
        essence: 0,
        catalystLevel: 0,
        unlockedCells: 6,
        grid,
        currentOrder: { id: 1, tier: 1, reward: 12 },
        highestDiscoveredTier: 0,
        discoveries: [0],
        ordersCompleted: 0,
        mergesCompleted: 0,
        gatheredCount: 0
      };
    }

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return createInitialState();
        const parsed = JSON.parse(raw);
        return { ...createInitialState(), ...parsed };
      } catch { return createInitialState(); }
    }

    const state = load();

    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function catalystMultiplier() { return 1 + state.catalystLevel * 0.25; }
    function catalystCost() { return Math.round(16 * Math.pow(1.85, state.catalystLevel)); }
    function unlockCost() { return unlockCosts[state.unlockedCells - 6] ?? null; }
    function firstEmpty() { for (let i = 0; i < state.unlockedCells; i++) if (state.grid[i] === null) return i; return -1; }
    function countTier(tier) { return state.grid.filter((value, index) => index < state.unlockedCells && value === tier).length; }
    function orderProgress() { const have = countTier(state.currentOrder.tier); return { have, need: 1, completed: have >= 1 }; }
    function canFulfill() { return orderProgress().completed; }
    function createOrder(highestTier, catalystLevel) {
      const maxTier = Math.max(1, Math.min(highestTier, ITEMS.length - 1));
      const minTier = Math.max(1, maxTier - 1);
      const tier = maxTier === 1 ? 1 : Math.floor(Math.random() * (maxTier - minTier + 1)) + minTier;
      const reward = Math.round((ORDER_REWARDS[tier] || 12) * (1 + catalystLevel * 0.25));
      return { id: Date.now() + Math.random(), tier, reward };
    }
    function showToast(text, tone) {
      toastState = { text, tone };
      renderToast();
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastState = null; renderToast(); }, 1700);
    }
    function maybeRepairOrder() {
      if (state.currentOrder.tier > state.highestDiscoveredTier) {
        state.currentOrder = createOrder(state.highestDiscoveredTier, state.catalystLevel);
      }
    }
    function gather() {
      const idx = firstEmpty();
      if (idx === -1) return;
      state.grid[idx] = 0;
      state.gatheredCount += 1;
      save();
      showToast(countTier(0) >= 2 ? 'Теперь соедини два Spark.' : 'Новая Spark появилась на столе.', 'info');
      render();
    }
    function interact(index) {
      if (index >= state.unlockedCells) return;
      const value = state.grid[index];
      if (value === null) { selectedIndex = null; render(); return; }
      if (selectedIndex === null) { selectedIndex = index; render(); return; }
      if (selectedIndex === index) { selectedIndex = null; render(); return; }
      const selectedValue = state.grid[selectedIndex];
      if (selectedValue === null || selectedValue !== value || value >= ITEMS.length - 1) { selectedIndex = index; render(); return; }
      const nextTier = value + 1;
      const discovered = !state.discoveries.includes(nextTier);
      state.grid[selectedIndex] = null;
      state.grid[index] = nextTier;
      state.highestDiscoveredTier = Math.max(state.highestDiscoveredTier, nextTier);
      if (discovered) state.discoveries.push(nextTier);
      state.discoveries.sort((a,b) => a-b);
      state.mergesCompleted += 1;
      selectedIndex = null;
      flashCellIndex = index;
      maybeRepairOrder();
      save();
      showToast(discovered ? `Новое открытие: ${ITEMS[nextTier].name}` : `Merge → ${ITEMS[nextTier].name}`, discovered ? 'magic' : 'success');
      render();
      setTimeout(() => { flashCellIndex = null; render(); }, 520);
    }
    function fulfill() {
      const idx = state.grid.findIndex((v, i) => i < state.unlockedCells && v === state.currentOrder.tier);
      if (idx === -1) return;
      state.grid[idx] = null;
      state.essence += state.currentOrder.reward;
      state.ordersCompleted += 1;
      const reward = state.currentOrder.reward;
      state.currentOrder = createOrder(Math.max(state.highestDiscoveredTier, 1), state.catalystLevel);
      save();
      showToast(`Заказ выполнен: +${reward} essence`, 'success');
      render();
    }
    function unlockCell() {
      const cost = unlockCost();
      if (cost === null || state.essence < cost) return;
      state.essence -= cost;
      state.unlockedCells += 1;
      save();
      showToast(`Открыта новая клетка. Теперь доступно ${state.unlockedCells} мест.`, 'success');
      render();
    }
    function upgradeCatalyst() {
      const cost = catalystCost();
      if (state.essence < cost) return;
      state.essence -= cost;
      state.catalystLevel += 1;
      state.currentOrder = createOrder(Math.max(state.highestDiscoveredTier, 1), state.catalystLevel);
      save();
      showToast(`Катализатор усилен до уровня ${state.catalystLevel}.`, 'magic');
      render();
    }

    document.getElementById('gatherBtn').addEventListener('click', gather);
    document.getElementById('fulfillBtn').addEventListener('click', fulfill);
    document.getElementById('unlockBtn').addEventListener('click', unlockCell);
    document.getElementById('catalystBtn').addEventListener('click', upgradeCatalyst);

    function renderToast() {
      const wrap = document.getElementById('toastWrap');
      wrap.innerHTML = toastState ? `<div class="toast ${toastState.tone}">${toastState.text}</div>` : '';
    }

    function renderObjective() {
      const objective = document.getElementById('objectiveCard');
      const sparkCount = countTier(0);
      const progress = orderProgress();
      let title = 'Твоя цель';
      let body = 'Собирай ингредиенты, объединяй одинаковые и закрывай заказы.';
      let bullets = [];
      let focus = { gather: false, fulfill: false, unlock: false, catalyst: false };

      if (state.ordersCompleted === 0 && state.mergesCompleted === 0 && sparkCount < 2) {
        title = 'Шаг 1 — создай второй Spark';
        body = 'На столе уже лежит 1 Spark. Нажми «Создать Spark» ещё один раз, чтобы получить пару для первого merge.';
        bullets = ['Главное действие должно быть очевидным с первого экрана.', 'Сейчас тебе нужен только второй Spark.'];
        focus.gather = true;
      } else if (state.ordersCompleted === 0 && state.mergesCompleted === 0) {
        title = 'Шаг 2 — сделай первый merge';
        body = selectedIndex === null
          ? 'Тапни по одному Spark, потом по второму Spark. Два одинаковых элемента превращаются в Glow Herb.'
          : 'Один Spark уже выбран. Теперь тапни по другому Spark, чтобы получить Glow Herb.';
        bullets = ['Правило игры: 2 одинаковых элемента = 1 новый tier.', 'Игрок играет ради открытия нового объекта.'];
      } else if (state.ordersCompleted === 0 && progress.completed) {
        title = 'Шаг 3 — сдай первый заказ';
        body = 'Glow Herb уже готов. Нажми «Сдать заказ» и получи первую essence.';
        bullets = ['Заказ превращает открытие в валюту.', 'После награды появится выбор между новой клеткой и усилением катализатора.'];
        focus.fulfill = true;
      } else if (state.ordersCompleted === 0) {
        title = 'Собери Glow Herb для заказа';
        body = 'Повтори цикл: создай Spark → создай Spark → объедини одинаковые элементы.';
        bullets = ['Формулы показаны справа от цели.', 'Когда нужный tier будет на столе, кнопка заказа станет активной.'];
        focus.gather = true;
      } else if (unlockCost() !== null && state.essence >= unlockCost()) {
        title = 'Первая мета-награда';
        body = 'Открой новую клетку. Больше места на столе = длиннее цепочки merge и меньше тупиков.';
        bullets = ['Расширение пространства — главный early meta-loop.', 'Новый контент должен приходить быстро.'];
        focus.unlock = true;
      } else if (state.essence >= catalystCost()) {
        title = 'Усиль катализатор';
        body = 'Катализатор повышает награду за будущие заказы. Это твой первый экономический усилитель.';
        bullets = [`Текущий множитель наград: x${catalystMultiplier().toFixed(2)}.`, 'Катализатор усиливает value order loop.'];
        focus.catalyst = true;
      } else {
        const item = ITEMS[state.currentOrder.tier];
        title = `Следующая цель — ${item.name}`;
        body = `Текущий заказ просит ${item.name}. Собери нужный tier и сдай его ради essence.`;
        bullets = ['Смотри на быстрые рецепты.', 'Новые открытия сразу попадают в журнал.'];
        focus.gather = true;
      }

      objective.innerHTML = `
        <div class="objective-eyebrow">Что делать сейчас</div>
        <h3>${title}</h3>
        <p>${body}</p>
        <ul>${bullets.map((item) => `<li>${item}</li>`).join('')}</ul>
      `;

      document.getElementById('gatherBtn').classList.toggle('focus', focus.gather);
      document.getElementById('fulfillBtn').classList.toggle('focus', focus.fulfill);
      document.getElementById('unlockBtn').classList.toggle('focus', focus.unlock);
      document.getElementById('catalystBtn').classList.toggle('focus', focus.catalyst);
    }

    function renderRecipes() {
      document.getElementById('recipeRail').innerHTML = ITEMS.slice(0, -1).map((item) => {
        const next = ITEMS[item.tier + 1];
        return `<div class="recipe-chip"><span class="recipe-part">${item.emoji} ${item.name}</span><span class="recipe-arrow">×2 →</span><span class="recipe-part target">${next.emoji} ${next.name}</span></div>`;
      }).join('');
    }

    function renderOrder() {
      const order = ITEMS[state.currentOrder.tier];
      const previous = ITEMS[Math.max(0, state.currentOrder.tier - 1)];
      const progress = orderProgress();
      document.getElementById('orderCard').innerHTML = `
        <div class="order-main">
          <div class="order-item">
            <span class="order-emoji">${order.emoji}</span>
            <div>
              <strong>${order.name}</strong>
              <div class="muted">Tier ${order.tier}</div>
            </div>
          </div>
          <div class="order-reward">+${state.currentOrder.reward} essence</div>
        </div>
        <div class="order-progress ${progress.completed ? 'ready' : ''}">На столе: ${progress.have}/${progress.need}</div>
        <div class="formula-line">Формула: 2 ${previous.name} → ${order.name}</div>
        <div class="muted">Катализатор: ур. ${state.catalystLevel} · множитель наград x${catalystMultiplier().toFixed(2)}</div>
      `;
    }

    function renderBoardStatus() {
      const entries = new Map();
      for (let i = 0; i < state.unlockedCells; i++) {
        const tier = state.grid[i];
        if (tier === null) continue;
        entries.set(tier, (entries.get(tier) || 0) + 1);
      }
      const status = document.getElementById('boardStatus');
      if (entries.size === 0) {
        status.innerHTML = '<span class="summary-chip muted">Стол пуст — создай Spark.</span>';
        return;
      }
      status.innerHTML = Array.from(entries.entries()).sort((a,b) => a[0]-b[0]).map(([tier, count]) => `<span class="summary-chip">${ITEMS[tier].emoji} ${ITEMS[tier].name} ×${count}</span>`).join('');
    }

    function renderBoard() {
      renderBoardStatus();
      const board = document.getElementById('board');
      board.innerHTML = '';
      const selectedTier = selectedIndex !== null ? state.grid[selectedIndex] : null;

      for (let i = 0; i < state.grid.length; i++) {
        const unlocked = i < state.unlockedCells;
        const value = state.grid[i];
        const btn = document.createElement('button');
        btn.className = 'cell';

        if (!unlocked) {
          btn.classList.add('locked');
          btn.innerHTML = '<div style="font-size:28px">🔒</div><div style="font-size:13px;font-weight:700">Locked</div>';
          btn.disabled = true;
        } else if (value === null) {
          btn.classList.add('empty');
          btn.innerHTML = '<div style="font-size:28px">+</div><div style="font-size:13px;font-weight:700">Empty slot</div>';
        } else {
          const item = ITEMS[value];
          btn.innerHTML = `<div style="font-size:28px">${item.emoji}</div><div style="font-size:13px;font-weight:700">${item.name}</div>`;
          btn.style.background = `radial-gradient(circle at top, ${item.color}55, transparent 60%), linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.14))`;
          if (state.ordersCompleted === 0 && state.mergesCompleted === 0 && value === 0 && selectedIndex === null) btn.classList.add('goal');
          if (selectedTier !== null && value === selectedTier && i !== selectedIndex) btn.classList.add('match');
        }
        if (selectedIndex === i) btn.classList.add('selected');
        if (flashCellIndex === i) btn.classList.add('flash');
        btn.addEventListener('click', () => interact(i));
        board.appendChild(btn);
      }

      document.getElementById('boardHint').textContent = selectedIndex === null
        ? 'Тапни по двум одинаковым элементам, чтобы объединить их.'
        : 'Элемент выбран. Тапни по такому же для merge.';
    }

    function renderJournal() {
      const journal = document.getElementById('journal');
      journal.innerHTML = '';
      ITEMS.forEach(item => {
        const found = state.discoveries.includes(item.tier);
        const el = document.createElement('div');
        el.className = 'entry' + (found ? '' : ' hidden');
        el.innerHTML = found
          ? `<div style="font-size:22px">${item.emoji}</div><div><div class="journal-name">${item.name}</div><div class="muted">${item.description}</div></div>`
          : '<div style="font-size:22px">❔</div><div>Unknown Formula</div>';
        journal.appendChild(el);
      });
    }

    function renderButtons() {
      document.getElementById('gatherBtn').disabled = firstEmpty() === -1;
      document.getElementById('fulfillBtn').disabled = !canFulfill();
      const uCost = unlockCost();
      const unlockBtn = document.getElementById('unlockBtn');
      unlockBtn.disabled = uCost === null || state.essence < uCost;
      unlockBtn.textContent = uCost === null ? 'Все клетки открыты' : `Открыть клетку (${uCost})`;
      const cCost = catalystCost();
      const catalystBtn = document.getElementById('catalystBtn');
      catalystBtn.disabled = state.essence < cCost;
      catalystBtn.textContent = `Усилить катализатор (${cCost})`;
    }

    function render() {
      document.getElementById('essence').textContent = Math.floor(state.essence);
      document.getElementById('discoveriesCount').textContent = state.discoveries.length;
      document.getElementById('ordersCompleted').textContent = state.ordersCompleted;
      renderObjective();
      renderRecipes();
      renderOrder();
      renderBoard();
      renderJournal();
      renderButtons();
      renderToast();
    }

    render();
  </script>
</body>
</html>
